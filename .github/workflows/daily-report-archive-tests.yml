name: Daily Fantasy report archive tests

on:
  pull_request:
    paths:
      - "scripts/daily_report_archive.py"
      - "scripts/generate_daily_report.py"
      - "scripts/nba_data_adapter.py"
      - "scripts/report_archive_naming.py"
      - "scripts/publish_daily_report_github.py"
      - "tests/test_daily_report_archive.py"
      - "tests/test_publish_archive.py"
      - "tests/test_nba_data_adapter.py"
      - "tests/test_generate_daily_report.py"
      - "tests/fixtures/**"
      - ".github/workflows/daily-report-archive-tests.yml"
  push:
    branches:
      - feature/daily-fantasy-report-archive-20261022
    paths:
      - "scripts/daily_report_archive.py"
      - "scripts/generate_daily_report.py"
      - "scripts/nba_data_adapter.py"
      - "scripts/report_archive_naming.py"
      - "scripts/publish_daily_report_github.py"
      - "tests/test_daily_report_archive.py"
      - "tests/test_publish_archive.py"
      - "tests/test_nba_data_adapter.py"
      - "tests/test_generate_daily_report.py"
      - "tests/fixtures/**"
      - ".github/workflows/daily-report-archive-tests.yml"

permissions:
  contents: read

jobs:
  offline-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m py_compile scripts/daily_report_archive.py scripts/generate_daily_report.py scripts/nba_data_adapter.py scripts/report_archive_naming.py scripts/publish_daily_report_github.py tests/test_daily_report_archive.py tests/test_publish_archive.py tests/test_nba_data_adapter.py tests/test_generate_daily_report.py
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -p 'test_*archive.py' -v && python -m unittest discover -s tests -p 'test_nba_data_adapter.py' -v && python -m unittest discover -s tests -p 'test_generate_daily_report.py' -v
