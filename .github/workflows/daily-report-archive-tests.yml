name: Daily Fantasy report archive tests

on:
  pull_request:
    paths:
      - "scripts/daily_report_archive.py"
      - "tests/test_daily_report_archive.py"
      - ".github/workflows/daily-report-archive-tests.yml"
  push:
    branches:
      - feature/daily-fantasy-report-archive-20261022
    paths:
      - "scripts/daily_report_archive.py"
      - "tests/test_daily_report_archive.py"
      - ".github/workflows/daily-report-archive-tests.yml"

permissions:
  contents: read

jobs:
  offline-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m py_compile scripts/daily_report_archive.py tests/test_daily_report_archive.py
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -p 'test_daily_report_archive.py' -v
